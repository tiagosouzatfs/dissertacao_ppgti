# Escuta por MQTT-SN em UDP 1884
listener 1884 INADDR_ANY mqtts

# Gateway de MQTT-SN para MQTT
connection mosquitto-bridge
    address 10.0.0.1:1883
    topic # out



# mqttsngateway.conf

# Habilita o gateway MQTT-SN
gateway_udp_port 1884               # Porta UDP para MQTT-SN
gateway_mqtt_address 10.0.0.1      # Endereço do broker MQTT (Mosquitto, EMQX, etc.)
gateway_mqtt_port 1883              # Porta do broker MQTT
gateway_type 1                      # Tipo 1 = MQTT-SN → MQTT
max_inflight_messages 20

# Logging (opcional)
trace_output protocol